appId: com.facilitypro.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Mobile OTP Sign-In"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: qa_login_preview_employee
    direction: DOWN
    timeout: 30000
- tapOn:
    id: qa_login_preview_employee
- extendedWaitUntil:
    visible:
      id: qa_hrms_tab_home
    timeout: 30000

# Home
- assertVisible: "HRMS command deck"
- assertVisible: "Preview mode is active"
- assertVisible:
    id: qa_hrms_tab_attendance
- assertVisible:
    id: qa_hrms_tab_leave
- assertVisible:
    id: qa_hrms_tab_payslips
- assertVisible:
    id: qa_hrms_tab_documents

# Attendance: read-only verification only, avoid camera-dependent mutation in deterministic E2E
- tapOn:
    id: qa_hrms_tab_attendance
- assertVisible: "Selfie + geo-fence attendance"
- assertVisible: "Checked in"
- assertVisible: "Recent attendance"

# Leave: submit a fresh request and verify it becomes the newest history row
- tapOn:
    id: qa_hrms_tab_leave
- assertVisible: "Leave desk"
- tapOn:
    id: qa_hrms_leave_type_paid_leave
- tapOn:
    id: qa_hrms_leave_start_date
- inputText: "2026-04-20"
- hideKeyboard
- tapOn:
    id: qa_hrms_leave_end_date
- inputText: "2026-04-21"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: qa_hrms_leave_reason
    direction: DOWN
    timeout: 15000
- tapOn:
    id: qa_hrms_leave_reason
- inputText: "Employee mobile E2E leave request."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: qa_hrms_submit_leave
    direction: DOWN
    timeout: 15000
- tapOn:
    id: qa_hrms_submit_leave
- scrollUntilVisible:
    element:
      id: qa_hrms_leave_request_row_0
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: qa_hrms_leave_request_row_0
- assertVisible:
    id: qa_hrms_leave_request_title_0
- assertVisible: "Employee mobile E2E leave request."
- assertVisible:
    id: qa_hrms_leave_request_status_0

# Payslips: verify the top preview payslip row is present
- tapOn:
    id: qa_hrms_tab_payslips
- assertVisible: "Payslips and salary view"
- scrollUntilVisible:
    element:
      id: qa_hrms_payslip_row_0
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: qa_hrms_payslip_row_0

# Documents: verify the top preview document row is present
- tapOn:
    id: qa_hrms_tab_documents
- assertVisible: "Document vault"
- scrollUntilVisible:
    element:
      id: qa_hrms_document_row_0
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: qa_hrms_document_row_0
- assertVisible:
    id: qa_hrms_document_title_0
- assertVisible: "Verified"

# Return home
- tapOn:
    id: qa_hrms_tab_home
- assertVisible: "HRMS command deck"
