appId: com.facilitypro.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Mobile OTP Sign-In"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: qa_login_preview_service_boy
    direction: DOWN
    timeout: 30000
- tapOn:
    id: qa_login_preview_service_boy
- extendedWaitUntil:
    visible:
      id: qa_service_tab_home
    timeout: 30000

- assertVisible: "Service Operations workspace"
- assertVisible:
    id: qa_service_tab_tasks
- assertVisible:
    id: qa_service_tab_materials
- assertVisible:
    id: qa_service_tab_proof

- tapOn:
    id: qa_service_tab_tasks
- assertVisible: "Assigned jobs and field progression"
- assertVisible:
    id: qa_service_task_card_0
- assertVisible: "Clubhouse chair alignment and cleaning"

- tapOn:
    id: qa_service_tab_materials
- assertVisible: "Supply requests"
- scrollUntilVisible:
    element:
      id: qa_service_request_card_0
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: qa_service_request_card_0
- assertVisible: "Absorbent floor pads"
- tapOn:
    id: qa_service_mark_issued_0
- assertVisible: "issued"
- tapOn:
    id: qa_service_material_task_0
- tapOn:
    id: qa_service_material_label
- inputText: "Microfiber cloth"
- hideKeyboard
- tapOn:
    id: qa_service_material_quantity
- inputText: "4"
- hideKeyboard
- tapOn:
    id: qa_service_material_unit
- inputText: "packs"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: qa_service_material_note
    direction: DOWN
    timeout: 15000
- tapOn:
    id: qa_service_material_note
- inputText: "Service mobile E2E supply request."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: qa_service_submit_material_request
    direction: DOWN
    timeout: 15000
- tapOn:
    id: qa_service_submit_material_request
- scrollUntilVisible:
    element:
      id: qa_service_request_card_0
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: qa_service_request_card_0
- assertVisible: "Microfiber cloth"
- assertVisible: "Service mobile E2E supply request."

- tapOn:
    id: qa_service_tab_proof
- assertVisible: "Attendance and proof capture"
- assertVisible:
    id: qa_service_proof_selected_title

- tapOn:
    id: qa_service_tab_home
- assertVisible: "Service Operations workspace"
